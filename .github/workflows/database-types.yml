name: Database type contract

on:
  pull_request:
    paths:
      - "src/types/database.ts"
      - "supabase/**"
      - "scripts/database-types.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-types.yml"
  push:
    branches: [main]
    paths:
      - "src/types/database.ts"
      - "supabase/**"
      - "scripts/database-types.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-types.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:types:check
      - run: npm run typecheck
      - if: always()
        run: npm run db:stop
